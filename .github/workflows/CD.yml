name: DeVine AI CD

on:
  workflow_run:
    workflows: ["DeVine AI CI"]
    types:
      - completed
    branches: [ main, qa ]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    # qa(개발환경, OCI ARM)는 ARM 네이티브 러너에서 arm64 이미지 생성.
    # main(운영, EC2 x86)은 기존 그대로.
    runs-on: ${{ github.event.workflow_run.head_branch == 'qa' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - uses: docker/setup-buildx-action@v3

    # Docker Hub 로그인
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/devine-ai
        tags: |
          type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
          type=raw,value=qa-latest,enable=${{ github.event.workflow_run.head_branch == 'qa' }}
          type=sha,prefix=${{ github.event.workflow_run.head_branch }}-

    - uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 운영 배포 (EC2, x86)
  deploy-prod:
    name: Deploy to EC2
    needs: build-and-push
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
    - uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT }}
        script: |
          cd ~/Devine_Deploy/service

          # 동시 배포 시 .env / docker-compose.yml 을 서로 덮어쓰지 않도록
          # 배포 전 구간을 하나의 락으로 직렬화한다.
          (
          flock -w 300 9 || { echo "ERROR: failed to acquire deploy lock"; exit 1; }

          # 최신 배포 스크립트 가져오기
          git pull origin main

          # S3에서 환경변수 다운로드 (운영환경)
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/config/.env.prod .env
          if [ ! -f .env ] || [ ! -s .env ]; then
            echo "ERROR: .env.prod file missing or empty after S3 download"
            exit 1
          fi
          chmod 600 .env

          IMAGE="${{ secrets.DOCKER_USERNAME }}/devine-ai"

          # 1. 현재 이미지 백업 (롤백용)
          docker tag ${IMAGE}:latest ${IMAGE}:previous 2>/dev/null || true

          # 2. 새 이미지 pull
          export DOCKER_IMAGE_TAG=latest
          docker compose pull ai

          # 3. 기존 컨테이너 중지 및 삭제 후 새로 생성
          docker compose stop ai || true
          docker compose rm -f ai || true
          docker compose up -d --no-deps ai

          # 4. 헬스체크 (실패 시 롤백)
          CONTAINER_ID=$(docker compose ps -q ai)
          TIMEOUT=120
          HEALTHY=false

          echo "Waiting for container to be healthy..."
          while [ $TIMEOUT -gt 0 ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_ID 2>/dev/null || echo "starting")
            echo "Health status: $STATUS (timeout: ${TIMEOUT}s)"
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container is unhealthy, checking logs..."
              docker compose logs --tail=50 ai
              break
            fi
            sleep 3
            TIMEOUT=$((TIMEOUT - 3))
          done

          # 5. 헬스체크 실패 시 롤백 (previous 태그가 있을 때만)
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check failed, showing logs..."
            docker compose logs --tail=100 ai

            if docker image inspect ${IMAGE}:previous >/dev/null 2>&1; then
              echo "Rolling back..."
              docker compose stop ai || true
              docker compose rm -f ai || true
              export DOCKER_IMAGE_TAG=previous
              docker compose up -d --no-deps ai
            fi
            exit 1
          fi

          echo "AI (prod) Deployment successful!"

          # 6. 사용하지 않는 이미지 정리
          docker image prune -f
          ) 9>/tmp/devine-deploy.lock

  # 개발환경 배포 (OCI, ARM)
  deploy-qa:
    name: Deploy to OCI
    needs: build-and-push
    if: ${{ github.event.workflow_run.head_branch == 'qa' }}
    runs-on: ubuntu-latest

    steps:
    - uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.OCI_HOST }}
        username: ${{ secrets.OCI_USERNAME }}
        key: ${{ secrets.OCI_SSH_KEY }}
        port: ${{ secrets.OCI_SSH_PORT }}
        script: |
          cd ~/Devine_Deploy/service

          # 동시 배포 시 .env / docker-compose.yml 을 서로 덮어쓰지 않도록
          # 배포 전 구간을 하나의 락으로 직렬화한다.
          (
          flock -w 300 9 || { echo "ERROR: failed to acquire deploy lock"; exit 1; }

          # 최신 배포 스크립트 가져오기
          git pull origin main

          # S3에서 환경변수 다운로드 (개발환경)
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/config/.env.qa .env
          if [ ! -f .env ] || [ ! -s .env ]; then
            echo "ERROR: .env.qa file missing or empty after S3 download"
            exit 1
          fi
          chmod 600 .env

          IMAGE="${{ secrets.DOCKER_USERNAME }}/devine-ai"

          # 1. 현재 이미지 백업 (롤백용)
          docker tag ${IMAGE}:qa-latest ${IMAGE}:qa-previous 2>/dev/null || true

          # 2. 새 이미지 pull
          export DOCKER_IMAGE_TAG=qa-latest
          docker compose pull ai

          # 3. 기존 컨테이너 중지 및 삭제 후 새로 생성
          docker compose stop ai || true
          docker compose rm -f ai || true
          docker compose up -d --no-deps ai

          # 4. 헬스체크 (실패 시 롤백)
          CONTAINER_ID=$(docker compose ps -q ai)
          TIMEOUT=120
          HEALTHY=false

          echo "Waiting for container to be healthy..."
          while [ $TIMEOUT -gt 0 ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_ID 2>/dev/null || echo "starting")
            echo "Health status: $STATUS (timeout: ${TIMEOUT}s)"
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container is unhealthy, checking logs..."
              docker compose logs --tail=50 ai
              break
            fi
            sleep 3
            TIMEOUT=$((TIMEOUT - 3))
          done

          # 5. 헬스체크 실패 시 롤백 (qa-previous 태그가 있을 때만)
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check failed, showing logs..."
            docker compose logs --tail=100 ai

            if docker image inspect ${IMAGE}:qa-previous >/dev/null 2>&1; then
              echo "Rolling back..."
              docker compose stop ai || true
              docker compose rm -f ai || true
              export DOCKER_IMAGE_TAG=qa-previous
              docker compose up -d --no-deps ai
            fi
            exit 1
          fi

          echo "AI (qa) Deployment successful!"

          # 6. 사용하지 않는 이미지 정리
          docker image prune -f
          ) 9>/tmp/devine-deploy.lock
