name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main, qa ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/devine-ai

jobs:
  build-and-push:
    name: Build and Push Docker Image
    # qa(개발환경, OCI ARM)는 ARM 네이티브 러너에서 arm64 이미지 생성.
    # main(운영, EC2 x86)은 기존 그대로.
    runs-on: ${{ github.event.workflow_run.head_branch == 'qa' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - uses: docker/setup-buildx-action@v3

    # Docker Hub 로그인
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
          type=raw,value=qa-latest,enable=${{ github.event.workflow_run.head_branch == 'qa' }}
          type=sha,prefix=${{ github.event.workflow_run.head_branch }}-

    - uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 운영 배포 (EC2, x86)
  deploy-prod:
    name: Deploy to EC2
    needs: build-and-push
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
    - uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT }}
        script: |
          cd ~/Devine_Deploy/service

          # 최신 배포 스크립트 가져오기
          git pull origin main

          # S3에서 환경변수 다운로드
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/config/.env .env
          [ ! -f .env ] && exit 1

          IMAGE="${{ secrets.DOCKER_USERNAME }}/devine-ai"

          # 1. 현재 이미지 백업 (롤백용)
          docker tag ${IMAGE}:latest ${IMAGE}:previous 2>/dev/null || true

          # 2. 최신 이미지 pull
          docker pull ${IMAGE}:latest

          # 3. AI 컨테이너 재시작
          docker rm -f devine-ai 2>/dev/null || true
          docker compose up -d --no-deps ai

          # 4. 헬스체크 (실패 시 롤백)
          CONTAINER_ID=$(docker compose ps -q ai)
          TIMEOUT=60
          HEALTHY=false

          while [ $TIMEOUT -gt 0 ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_ID 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi
            sleep 2
            TIMEOUT=$((TIMEOUT - 2))
          done

          # 5. 헬스체크 실패 시 롤백
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check failed, rolling back..."
            docker compose logs ai

            # 실패한 망가진 컨테이너 삭제
            docker rm -f devine-ai 2>/dev/null || true

            # 이전 이미지로 복구 및 재실행
            docker tag ${IMAGE}:previous ${IMAGE}:latest
            docker compose up -d --no-deps ai
            exit 1
          fi

          echo "AI Deployment successful!"

          # 6. 사용하지 않는 이미지 정리
          docker image prune -af

  # 개발환경 배포 (OCI, ARM)
  deploy-qa:
    name: Deploy to OCI
    needs: build-and-push
    if: ${{ github.event.workflow_run.head_branch == 'qa' }}
    runs-on: ubuntu-latest

    steps:
    - uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.OCI_HOST }}
        username: ${{ secrets.OCI_USERNAME }}
        key: ${{ secrets.OCI_SSH_KEY }}
        port: ${{ secrets.OCI_SSH_PORT }}
        script: |
          cd ~/Devine_Deploy/service

          # 최신 배포 스크립트 가져오기
          git pull origin main

          # S3에서 환경변수 다운로드 (개발환경)
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/config/.env.qa .env
          [ ! -f .env ] && exit 1

          IMAGE="${{ secrets.DOCKER_USERNAME }}/devine-ai"

          # 1. 현재 이미지 백업 (롤백용)
          docker tag ${IMAGE}:qa-latest ${IMAGE}:qa-previous 2>/dev/null || true

          # 2. 최신 이미지 pull
          docker pull ${IMAGE}:qa-latest

          # 3. AI 컨테이너 재시작 (qa-latest 태그로 기동)
          export DOCKER_IMAGE_TAG=qa-latest
          docker rm -f devine-ai 2>/dev/null || true
          docker compose up -d --no-deps ai

          # 4. 헬스체크 (실패 시 롤백)
          CONTAINER_ID=$(docker compose ps -q ai)
          TIMEOUT=60
          HEALTHY=false

          while [ $TIMEOUT -gt 0 ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_ID 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi
            sleep 2
            TIMEOUT=$((TIMEOUT - 2))
          done

          # 5. 헬스체크 실패 시 롤백
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check failed, rolling back..."
            docker compose logs ai

            # 실패한 망가진 컨테이너 삭제
            docker rm -f devine-ai 2>/dev/null || true

            # 이전 이미지로 복구 및 재실행
            docker tag ${IMAGE}:qa-previous ${IMAGE}:qa-latest
            export DOCKER_IMAGE_TAG=qa-latest
            docker compose up -d --no-deps ai
            exit 1
          fi

          echo "AI (qa) Deployment successful!"

          # 6. 사용하지 않는 이미지 정리
          docker image prune -af
